name: Releases to CurseForge and/or Modrinth

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          
      - uses: gradle/actions/setup-gradle@v6
        name: Set up Gradle
        
      - name: Add permission
        run: chmod +x ./gradlew
        
      - name: Execute Gradle build
        run: ./gradlew build

      - name: Get artifact version
        id: version
        shell: bash
        run: |
          # Unimined's logger may print an initialization line even in quiet mode.
          version=$(./gradlew -q --console=plain printVersion | tail -n 1)
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Get Changes between Tags
        id: changes
        uses: simbo/changes-between-tags-action@v1

      - uses: Kir-Antipov/mc-publish@v3
        with:
          # Only include this section if you wish to publish
          # your assets on Modrinth.
          modrinth-id: placeholder
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          # Only include this section if you wish to publish
          # your assets on CurseForge.
          curseforge-id: placeholder
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          files: |
            build/libs/!(*-@(dev|sources|javadoc)).jar
            build/libs/*-@(dev|sources|javadoc).jar
          loaders: forge
          game-versions: 1.12.2
          java: |
            25
          version: ${{ steps.version.outputs.value }}
          changelog: ${{ steps.changes.outputs.changes }}
