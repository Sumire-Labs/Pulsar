name: Publish release

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      release_type:
        type: string
        default: beta
      publish_github:
        type: boolean
        default: false
      publish_maven:
        type: boolean
        default: true
      publish_curseforge:
        type: boolean
        default: true
      publish_modrinth:
        type: boolean
        default: true
    secrets:
      MAVEN_USER:
        required: false
      MAVEN_PASS:
        required: false
      CURSEFORGE_TOKEN:
        required: false
      MODRINTH_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (for example 0.6.3)
        required: true
        type: string
      release_type:
        description: Release channel on CurseForge and Modrinth
        type: choice
        options: [beta, alpha, release]
        default: beta
      publish_github:
        description: Create a GitHub release (leave off when retrying other destinations)
        type: boolean
        default: false
      publish_maven:
        description: Publish the public API to Artifact Keeper
        type: boolean
        default: true
      publish_curseforge:
        description: Publish the runtime mod to CurseForge
        type: boolean
        default: true
      publish_modrinth:
        description: Publish the runtime mod to Modrinth
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: refs/tags/${{ inputs.tag }}

      - name: Validate publication settings
        shell: bash
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
          PUBLISH_MAVEN: ${{ inputs.publish_maven }}
          PUBLISH_CF: ${{ inputs.publish_curseforge }}
          PUBLISH_MR: ${{ inputs.publish_modrinth }}
          MAVEN_USER: ${{ secrets.MAVEN_USER }}
          MAVEN_PASS: ${{ secrets.MAVEN_PASS }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          case "$RELEASE_TYPE" in alpha|beta|release) ;; *) echo "Invalid release_type"; exit 1 ;; esac
          if [[ "$PUBLISH_MAVEN" == true ]]; then
            : "${MAVEN_USER:?Set the MAVEN_USER Actions secret}"
            : "${MAVEN_PASS:?Set the MAVEN_PASS Actions secret}"
          fi
          if [[ "$PUBLISH_CF" == true ]]; then
            : "${CURSEFORGE_TOKEN:?Set the CURSEFORGE_TOKEN Actions secret}"
          fi
          if [[ "$PUBLISH_MR" == true ]]; then
            : "${MODRINTH_TOKEN:?Set the MODRINTH_TOKEN Actions secret}"
          fi

      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and check
        run: |
          chmod +x ./gradlew
          ./gradlew build

      - name: Resolve release artifacts and changelog
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version=$(./gradlew -q --console=plain printVersion | tail -n 1)
          if [[ "$version" != "${RELEASE_TAG#v}" ]]; then
            echo "Tag $RELEASE_TAG does not match Gradle version $version"
            exit 1
          fi
          # Exact path prevents API/dev/source jars from becoming mod downloads.
          file="build/libs/pulsar-${version}.jar"
          test -f "$file"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "file=$file" >> "$GITHUB_OUTPUT"
          previous=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [[ -n "$previous" ]]; then
            git log --no-merges --format='- %s (%h)' "$previous..HEAD" > build/release-changelog.md
          else
            git log --no-merges --format='- %s (%h)' HEAD > build/release-changelog.md
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: pulsar-${{ steps.release.outputs.version }}
          path: |
            build/libs/*.jar
            build/release-changelog.md
          if-no-files-found: error

      - name: Create GitHub release
        if: inputs.publish_github
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ inputs.tag }}
          artifacts: build/libs/*.jar
          bodyFile: build/release-changelog.md
          prerelease: ${{ inputs.release_type != 'release' }}

      - name: Publish API to Artifact Keeper
        if: inputs.publish_maven
        env:
          MAVEN_USER: ${{ secrets.MAVEN_USER }}
          MAVEN_PASS: ${{ secrets.MAVEN_PASS }}
        run: ./gradlew -Ppublish_to_maven=true publishPulsarApiPublicationToArtifactKeeperRepository

      - name: Publish runtime mod to CurseForge
        if: inputs.publish_curseforge
        uses: Kir-Antipov/mc-publish@v3
        with:
          curseforge-id: '1641056'
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: ${{ steps.release.outputs.file }}
          loaders: forge
          game-versions: 1.12.2
          java: '25'
          version: ${{ steps.release.outputs.version }}
          version-type: ${{ inputs.release_type }}
          changelog-file: build/release-changelog.md

      - name: Publish runtime mod to Modrinth
        if: inputs.publish_modrinth
        uses: Kir-Antipov/mc-publish@v3
        with:
          modrinth-id: gs7RbryI
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: ${{ steps.release.outputs.file }}
          loaders: forge
          game-versions: 1.12.2
          java: '25'
          version: ${{ steps.release.outputs.version }}
          version-type: ${{ inputs.release_type }}
          changelog-file: build/release-changelog.md
