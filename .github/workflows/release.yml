name: Releases

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  publish:
    uses: ./.github/workflows/release-to-cf-mr.yml
    with:
      tag: ${{ github.ref_name }}
      # Existing 0.x releases are beta. Override with the RELEASE_TYPE variable.
      release_type: ${{ vars.RELEASE_TYPE || 'beta' }}
      publish_github: true
    secrets: inherit
