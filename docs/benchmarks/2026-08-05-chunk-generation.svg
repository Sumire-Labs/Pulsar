<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title description">
  <title id="title">Fresh chunk generation benchmark</title>
  <desc id="description">Median total time for three runs. Vanilla took 56.461 seconds, Alfheim took 49.615 seconds, and Pulsar took 48.831 seconds. Lower is better. Whiskers show the range of the three runs.</desc>
  <style>
    .background { fill: #ffffff; }
    .text { fill: #24292f; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .muted { fill: #57606a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .grid { stroke: #d0d7de; }
    .axis { stroke: #8c959f; }
    .range { stroke: #24292f; }
    .value { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .background { fill: #0d1117; }
      .text { fill: #f0f6fc; }
      .muted { fill: #8c959f; }
      .grid { stroke: #30363d; }
      .axis { stroke: #6e7681; }
      .range { stroke: #f0f6fc; }
    }
  </style>

  <rect class="background" width="900" height="360" />
  <text class="text" x="450" y="30" text-anchor="middle" font-size="20" font-weight="600">Fresh chunk generation until lighting completes</text>
  <text class="muted" x="450" y="54" text-anchor="middle" font-size="14">Median of 3 runs; whiskers show measured range; lower is better</text>

  <g class="grid" stroke-width="1">
    <line x1="180" y1="72" x2="180" y2="312" />
    <line x1="280" y1="72" x2="280" y2="312" />
    <line x1="380" y1="72" x2="380" y2="312" />
    <line x1="480" y1="72" x2="480" y2="312" />
    <line x1="580" y1="72" x2="580" y2="312" />
    <line x1="680" y1="72" x2="680" y2="312" />
    <line x1="780" y1="72" x2="780" y2="312" />
  </g>

  <text class="text" x="160" y="111" text-anchor="end" font-size="16">Vanilla</text>
  <rect x="180" y="88" width="564.61" height="36" rx="4" fill="#6e7781" />
  <text class="value" x="734.61" y="112" text-anchor="end" font-size="15">56.461 s</text>
  <g class="range" stroke-width="2">
    <line x1="736.39" y1="134" x2="766.28" y2="134" />
    <line x1="736.39" y1="129" x2="736.39" y2="139" />
    <line x1="766.28" y1="129" x2="766.28" y2="139" />
  </g>

  <text class="text" x="160" y="191" text-anchor="end" font-size="16">Alfheim</text>
  <rect x="180" y="168" width="496.15" height="36" rx="4" fill="#d97706" />
  <text class="value" x="666.15" y="192" text-anchor="end" font-size="15">49.615 s</text>
  <g class="range" stroke-width="2">
    <line x1="666.00" y1="214" x2="694.78" y2="214" />
    <line x1="666.00" y1="209" x2="666.00" y2="219" />
    <line x1="694.78" y1="209" x2="694.78" y2="219" />
  </g>

  <text class="text" x="160" y="271" text-anchor="end" font-size="16" font-weight="600">Pulsar</text>
  <rect x="180" y="248" width="488.31" height="36" rx="4" fill="#7c3aed" />
  <text class="value" x="658.31" y="272" text-anchor="end" font-size="15">48.831 s</text>
  <g class="range" stroke-width="2">
    <line x1="661.02" y1="294" x2="670.35" y2="294" />
    <line x1="661.02" y1="289" x2="661.02" y2="299" />
    <line x1="670.35" y1="289" x2="670.35" y2="299" />
  </g>

  <line class="axis" x1="180" y1="312" x2="780" y2="312" stroke-width="1.5" />
  <g class="muted" font-size="13" text-anchor="middle">
    <text x="180" y="332">0</text>
    <text x="280" y="332">10</text>
    <text x="380" y="332">20</text>
    <text x="480" y="332">30</text>
    <text x="580" y="332">40</text>
    <text x="680" y="332">50</text>
    <text x="780" y="332">60 s</text>
  </g>
</svg>
