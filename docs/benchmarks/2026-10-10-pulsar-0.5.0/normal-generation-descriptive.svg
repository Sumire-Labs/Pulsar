  <g id="text_19">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(7.2 417.347473)">Same machine, world and work per case. Median of 4 independent JVM run means; whiskers show run min–max.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(63.12375 428.149934)">Lower is better. See methods and validation tables; no confidence intervals are implied.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(81.966094 438.952395)">Terrain/light hashes differ. These values are not an equal-output speed ranking.</text>
  </g>
