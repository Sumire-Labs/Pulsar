  <g id="text_15">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(7.2 417.347473)">Same machine, seed and requested workload per case. Median of 4 independent JVM run means; whiskers show run min–max.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(95.251641 428.149934)">Lower is better. See methods and validation tables; no confidence intervals are implied.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(95.956875 438.952395)">Worker CPU is excluded; final light drain and verification required. Vanilla not validated.</text>
