<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="624" viewBox="0 0 1180 624" role="img" aria-label="Sustained edit load on a 250 plus mod pack: Pulsar's tick time stays near the world's baseline at every edit rate while Alfheim and vanilla climb past the 20 TPS budget from 64 edits per tick">
  <style>
    :root { color-scheme: light dark; }
    .surface { fill: #fcfcfb; }
    .ink-1 { fill: #0b0b0b; }
    .ink-2 { fill: #52514e; }
    .muted { fill: #898781; }
    .grid { stroke: #e1e0d9; }
    .axis { stroke: #c3c2b7; }
    .s-pulsar { fill: #2a78d6; }
    .s-alfheim { fill: #eb6834; }
    .s-vanilla { fill: #1baf7a; }
    .l-pulsar { stroke: #2a78d6; }
    .l-alfheim { stroke: #eb6834; }
    .l-vanilla { stroke: #1baf7a; }
    .dot { stroke: #fcfcfb; }
    .zone { fill: #e1e0d9; opacity: 0.35; }
    .budget { stroke: #898781; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tnum { font-variant-numeric: tabular-nums; }
    @media (prefers-color-scheme: dark) {
      .surface { fill: #1a1a19; }
      .ink-1 { fill: #ffffff; }
      .ink-2 { fill: #c3c2b7; }
      .grid { stroke: #2c2c2a; }
      .axis { stroke: #383835; }
      .s-pulsar { fill: #3987e5; }
      .s-alfheim { fill: #d95926; }
      .s-vanilla { fill: #199e70; }
      .l-pulsar { stroke: #3987e5; }
      .l-alfheim { stroke: #d95926; }
      .l-vanilla { stroke: #199e70; }
      .dot { stroke: #1a1a19; }
      .zone { fill: #2c2c2a; opacity: 0.5; }
    }
  </style>

  <rect class="surface" x="0" y="0" width="1180" height="624"/>

  <!-- Header -->
  <text class="ink-1" x="60" y="40" font-size="22" font-weight="700">Sustained Edit Load on a 250+ Mod Pack</text>
  <text class="ink-2" x="60" y="64" font-size="13">291-mod Cleanroom 0.6.7-alpha pack · MSPT (avg tick work time) vs edits per tick · 20s per step, single sweep per engine · fresh world per engine, fixed seed</text>

  <!-- Legend -->
  <g font-size="13">
    <rect class="s-vanilla" x="60" y="84" width="14" height="14" rx="3"/>
    <text class="ink-2" x="80" y="96">vanilla 1.12.2</text>
    <rect class="s-alfheim" x="190" y="84" width="14" height="14" rx="3"/>
    <text class="ink-2" x="210" y="96">Alfheim 1.6</text>
    <rect class="s-pulsar" x="310" y="84" width="14" height="14" rx="3"/>
    <text class="ink-2" x="330" y="96">Pulsar 0.1.0-dev.15</text>
  </g>

  <!-- saturation zone: x >= 605 -->
  <rect class="zone" x="605" y="150" width="515" height="370"/>

  <!-- grid: 0..300ms over y 520..150 -->
  <g class="grid" stroke-width="1">
    <line x1="60" y1="396.7" x2="1120" y2="396.7"/>
    <line x1="60" y1="335"   x2="1120" y2="335"/>
    <line x1="60" y1="273.3" x2="1120" y2="273.3"/>
    <line x1="60" y1="211.7" x2="1120" y2="211.7"/>
    <line x1="60" y1="150"   x2="1120" y2="150"/>
  </g>
  <g class="muted" font-size="11" text-anchor="end">
    <text class="tnum" x="52" y="523">0</text>
    <text class="tnum" x="52" y="461">50ms</text>
    <text class="tnum" x="52" y="400">100ms</text>
    <text class="tnum" x="52" y="338">150ms</text>
    <text class="tnum" x="52" y="276">200ms</text>
    <text class="tnum" x="52" y="215">250ms</text>
    <text class="tnum" x="52" y="153">300ms</text>
  </g>

  <!-- 20 TPS budget line -->
  <line class="budget" x1="60" y1="458.3" x2="950" y2="458.3" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text class="muted" x="66" y="452" font-size="10.5">50 ms = 20 TPS budget</text>

  <!-- zone labels -->
  <text class="muted" x="332" y="168" font-size="11" text-anchor="middle">heavy industrial gameplay (TNT clearing, machine fleets)</text>
  <text class="muted" x="862" y="168" font-size="11" text-anchor="middle">saturation margin — beyond normal gameplay</text>

  <!-- series -->
  <polyline class="l-vanilla" fill="none" stroke-width="2" points="130,426.8 320,398.9 510,415.3 700,356.7 890,281.4 1080,171.1"/>
  <polyline class="l-alfheim" fill="none" stroke-width="2" points="130,433.2 320,419.7 510,389.4 700,347.5 890,294.8 1080,195.1"/>
  <polyline class="l-pulsar" fill="none" stroke-width="2.5" points="130,449.1 320,469.3 510,456.4 700,454.4 890,438.1 1080,412.6"/>

  <g class="dot" stroke-width="2">
    <circle class="s-vanilla" cx="130" cy="426.8" r="3.5"/><circle class="s-vanilla" cx="320" cy="398.9" r="3.5"/><circle class="s-vanilla" cx="510" cy="415.3" r="3.5"/><circle class="s-vanilla" cx="700" cy="356.7" r="3.5"/><circle class="s-vanilla" cx="890" cy="281.4" r="3.5"/><circle class="s-vanilla" cx="1080" cy="171.1" r="3.5"/>
    <circle class="s-alfheim" cx="130" cy="433.2" r="3.5"/><circle class="s-alfheim" cx="320" cy="419.7" r="3.5"/><circle class="s-alfheim" cx="510" cy="389.4" r="3.5"/><circle class="s-alfheim" cx="700" cy="347.5" r="3.5"/><circle class="s-alfheim" cx="890" cy="294.8" r="3.5"/><circle class="s-alfheim" cx="1080" cy="195.1" r="3.5"/>
    <circle class="s-pulsar" cx="130" cy="449.1" r="3.5"/><circle class="s-pulsar" cx="320" cy="469.3" r="3.5"/><circle class="s-pulsar" cx="510" cy="456.4" r="3.5"/><circle class="s-pulsar" cx="700" cy="454.4" r="3.5"/><circle class="s-pulsar" cx="890" cy="438.1" r="3.5"/><circle class="s-pulsar" cx="1080" cy="412.6" r="3.5"/>
  </g>

  <!-- end labels -->
  <text class="ink-2 tnum" x="1112" y="163" font-size="11" font-weight="600" text-anchor="end">vanilla 283 ms</text>
  <text class="ink-2 tnum" x="1112" y="215" font-size="11" font-weight="600" text-anchor="end">Alfheim 263 ms</text>
  <text class="ink-2 tnum" x="1112" y="400" font-size="11" font-weight="600" text-anchor="end">Pulsar 87 ms</text>
  <text class="ink-1" x="1112" y="386" font-size="12" font-weight="700" text-anchor="end">slope is edit hooks, not light</text>

  <!-- x axis -->
  <line class="axis" x1="60" y1="520" x2="1120" y2="520" stroke-width="1"/>
  <g class="ink-2 tnum" font-size="12" text-anchor="middle">
    <text x="130" y="540">64</text>
    <text x="320" y="540">128</text>
    <text x="510" y="540">256</text>
    <text x="700" y="540">512</text>
    <text x="890" y="540">1024</text>
    <text x="1080" y="540">2048</text>
  </g>
  <text class="muted" x="590" y="558" font-size="11" text-anchor="middle">edits per tick — each edit floods or re-shadows a sky column</text>

  <text class="muted" x="60" y="586" font-size="11">Pulsar's flat line doubles as a control: its +46 ms rise (128→2048) is the tick-thread cost of the edits themselves (mod block-update hooks). Subtracting it, Alfheim and vanilla pay +136–139 ms of lighting at 2048.</text>
  <text class="muted" x="60" y="604" font-size="11">Alfheim and vanilla exceed the 20 TPS budget from 64 edits/tick on this pack; Pulsar stays in budget to ~512. Fresh world per engine — modded worldgen varies spawn terrain, so compare slopes, not absolute offsets.</text>
</svg>
