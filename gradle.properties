org.gradle.jvmargs = -Xmx3G
org.gradle.caching = true
org.gradle.parallel = true
org.gradle.configuration-cache = true
org.gradle.configuration-cache.parallel = true

# Git tags determine the version. Do not set version or mod_version.
versioning.releaseBranch = main
# Keep alpha/beta/rc in release versions, e.g. tag 0.1.0-alpha.
versioning.stageInVersion = true

# Rename Java packages/directories when changing root_package.
root_package = com.sumirelabs.pulsar
mod_id = pulsar
mod_name = Pulsar Lighting Engine
mod_description = Pulsar is a lighting engine mod for Cleanroom, based on Starlight and SuperNova.
mod_url = https://github.com/Sumire-Labs/Pulsar
mod_update_json =
mod_authors = Sumire Labs, s12kuma01
mod_credits = SpottedLeaf(Starlight), GTNHTeam(SuperNova), RedStudio Ragnarök(Alfheim Lighting Engine)
mod_logo_path = assets/icon.png
mod_issue_tracker = https://github.com/Sumire-Labs/Pulsar/issues

cleanroom_version = 0.7.14-alpha

enable_mixin = true
cg.userdev.refmap = pulsar.refmap.json

generate_sources_jar = true
generate_javadocs_jar = false
enable_junit_testing = true
show_testing_output = false
enable_shadow = false
enable_spotless = true

# Optional AT filenames under src/main/resources/META-INF, separated by spaces.
# Write SRG member names, e.g. field_130070_K. Empty disables ATs.
access_transformers = pulsar_at.cfg
# Set a fully qualified IFMLLoadingPlugin class to enable the coremod.
coremod_plugin_class = com.sumirelabs.pulsar.core.PulsarLoadingPlugin
coremod_includes_mod = true
use_asset_mover = false
asset_mover_version = 3.0.1

minecraft_username = Developer
# Whitespace-delimited; quoted spaces are not supported.
extra_jvm_args =
enable_foundation_debug = false
enable_mixin_debug = false

# Maven: compile-only API and matching sources, retaining com.sumirelabs:pulsar-api.
# Credentials: artifactKeeperUsername / artifactKeeperPassword Gradle properties,
# or MAVEN_USERNAME / MAVEN_PASSWORD environment variables.
publish_to_maven = true
publish_to_local_maven = false
maven_name = artifactKeeper
maven_url = https://artifact.sumirelabs.com/maven/releases

# Optional Mod publishing. Empty IDs skip these destinations.
# Tokens: CURSEFORGE_TOKEN / MODRINTH_TOKEN environment variables.
curseforge_project_id = 1641056
modrinth_project_id = gs7RbryI

# License management: preserve LGPL and source-specific upstream notices.
license = LGPL-3.0-only
license_author = Sumire Labs
license_year = 2026
