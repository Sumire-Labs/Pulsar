repositories {
    maven { url = 'https://maven.ic2.player.to'; content { includeGroup 'net.industrial-craft' } }
    maven { url = 'https://modmaven.dev'; content { includeGroup 'com.enderio'; includeGroup 'com.enderio.core' } }
    maven {
        name = 'Covers1624'
        url = 'https://maven.covers1624.net'
        content { includeGroup 'codechicken'; includeGroup 'mrtjp' }
    }
    // Other repositories described by default:
    // CleanroomMC: https://maven.cleanroommc.com
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
    }
    maven {
        name = 'CleanroomCurseMaven'
        url = 'https://curse.cleanroommc.com'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
    mavenCentral()
    mavenLocal() // Must be last for caching to work
}

dependencies {
    if (project.hasProperty('celeritasTestClasspath')) {
        // Unimined remaps module artifacts, not bare file dependencies. A local
        // artifact-only Ivy repository lets it remap the supplied release jar.
        project.property('celeritasTestClasspath').toString().split(java.util.regex.Pattern.quote(File.pathSeparator)).eachWithIndex { path, index ->
            def rendererJar = file(path)
            // The optional headless probes do not use renderer GL access wideners.
            // Unimined currently assumes intermediary for these files even in a
            // searge jar. Strip only AW metadata in a disposable validation copy;
            // leave the user's jar and all bytecode untouched before remapping.
            def digest = java.util.HexFormat.of().formatHex(java.security.MessageDigest.getInstance('SHA-256').digest(rendererJar.bytes))
            def prepared = layout.buildDirectory.file("renderer-validation/${digest}/${rendererJar.name}").get().asFile
            if (!prepared.exists()) {
                prepared.parentFile.mkdirs()
                new java.util.zip.ZipFile(rendererJar).withCloseable { source ->
                    new java.util.zip.ZipOutputStream(new FileOutputStream(prepared)).withCloseable { output ->
                        source.entries().each { entry ->
                            if (!entry.name.endsWith('.accesswidener')) {
                                output.putNextEntry(new java.util.zip.ZipEntry(entry.name))
                                if (!entry.directory) source.getInputStream(entry).withCloseable { it.transferTo(output) }
                                output.closeEntry()
                            }
                        }
                    }
                }
            }
            def artifactName = rendererJar.name.replaceFirst(/\.jar$/, '')
            repositories.ivy {
                name = "PulsarRenderer${index}"
                url = prepared.parentFile.toURI()
                patternLayout { artifact '[artifact].[ext]' }
                metadataSources { artifact() }
                content { includeModule 'pulsar.test.renderer', artifactName }
            }
            rendererTestMods("pulsar.test.renderer:${artifactName}:${digest.substring(0, 12)}") { transitive = false }
        }
    }
    testImplementation('net.industrial-craft:industrialcraft-2:2.8.222-ex112:dev') { transitive = false }
    testImplementation('com.enderio.core:EnderCore:1.12.2-0.5.78:deobf') { transitive = false }
    compatTestMods('com.enderio:EnderIO:1.12.2-5.3.72') { transitive = false }
    classicTestMods('maven.modrinth:ic2classic:1.5.15') { transitive = false }
    // Exercise the real 1.12.2 multipart API without making it a runtime dependency.
    testImplementation('codechicken:ForgeMultipart:1.12.2-2.6.2.83:deobf') { transitive = false }
    testImplementation('codechicken:CodeChickenLib:1.12.2-3.2.3.358:deobf') { transitive = false }
    testImplementation 'org.scala-lang:scala-library:2.11.12'
    testImplementation('mrtjp:ProjectRed:1.12.2-4.9.3.118:deobf') { transitive = false }
    testImplementation('mrtjp:MrTJPCore:1.12.2-2.1.4.43:deobf') { transitive = false }
    // Fluidlogged API: soft dependency — FluidLightBridge merges the stored
    // fluid's opacity/emission into the engine's light reads when installed.
    compileOnly "maven.modrinth:fluidlogged-api:3.3.3"
    if (enable_lwjglx.toBoolean()) {
        compileOnly "com.cleanroommc:lwjglx:1.0.0"
    }
}
