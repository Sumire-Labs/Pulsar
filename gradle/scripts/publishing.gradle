// The public API publication is defined in api.gradle. Consumers provide their
// own Cleanroom development environment; engine dependencies stay out of its POM.
if (publish_to_maven.toBoolean()) {
    publishing {
        repositories {
            maven {
                name = 'artifactKeeper'
                url = providers.gradleProperty('maven_url').get()
                credentials {
                    username = providers.environmentVariable('MAVEN_USER').orNull
                    password = providers.environmentVariable('MAVEN_PASS').orNull
                }
                authentication {
                    basic(BasicAuthentication)
                }
            }
        }
    }
}
